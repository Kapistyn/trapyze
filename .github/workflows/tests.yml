name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the tests
        run: uv run --python ${{ matrix.python }} --with pytest python -m pytest -q

  installers:
    name: installer scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem installer\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
            Write-Host "$($f.Name) parses"
          }
      - name: Shell scripts parse
        shell: bash
        run: for f in installer/*.sh; do sh -n "$f" && echo "$f parses"; done
