name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the tests
        run: uv run --python ${{ matrix.python }} --with pytest --with pillow --with pandas python -m pytest -q

  installers:
    name: installer scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem installer\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
            Write-Host "$($f.Name) parses"
          }
      - name: Shell scripts parse
        shell: bash
        run: for f in installer/*.sh; do sh -n "$f" && echo "$f parses"; done

  install-windows:
    name: real install · Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build this version
        run: uv build --wheel --out-dir dist
      - name: Run the installer as a user would (old Windows PowerShell, uv not yet in its own place)
        shell: powershell
        run: |
          Remove-Item Env:UV_TOOL_DIR, Env:UV_TOOL_BIN_DIR, Env:UV_CACHE_DIR -ErrorAction SilentlyContinue  # like a normal computer
          $env:TRAPYZE_WHEEL = (Resolve-Path dist\*.whl).Path
          $env:TRAPYZE_NO_OPEN = "1"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: traPYze is there and answers
        shell: powershell
        run: |
          & "$env:USERPROFILE\.local\bin\trapyze.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path ([Environment]::GetFolderPath('Desktop') + '\traPYze.lnk'))) { Write-Error "no desktop shortcut"; exit 1 }
      - name: Running it again (an update) also works
        shell: powershell
        run: |
          Remove-Item Env:UV_TOOL_DIR, Env:UV_TOOL_BIN_DIR, Env:UV_CACHE_DIR -ErrorAction SilentlyContinue  # like a normal computer
          $env:TRAPYZE_WHEEL = (Resolve-Path dist\*.whl).Path
          $env:TRAPYZE_NO_OPEN = "1"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  install-unix:
    name: real install · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build this version
        run: uv build --wheel --out-dir dist
      - name: Run the installer as a user would
        run: |
          TRAPYZE_WHEEL="$(ls "$PWD"/dist/*.whl)" TRAPYZE_NO_OPEN=1 sh installer/install.sh
          "$(uv tool dir --bin)/trapyze" version
