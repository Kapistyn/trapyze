name: release

# Push a tag like v0.13.0 (matching the version in pyproject.toml) to publish a release:
# the wheel, traPYze-Setup.exe for Windows, the install scripts and the notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the version
        run: python3 tools/release.py check "$GITHUB_REF_NAME"
      - name: Point everything at this repository
        run: python3 tools/set_repo.py "$GITHUB_REPOSITORY"
      - name: Test
        run: uv run --python 3.12 --with pytest --with pillow python -m pytest -q
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Release notes and install scripts
        run: |
          python3 tools/release.py notes "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > notes.md
          cp installer/install.ps1 installer/install.sh installer/uninstall.ps1 installer/uninstall.sh dist/
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: actions/upload-artifact@v4
        with: { name: notes, path: notes.md }

  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point everything at this repository
        run: python tools/set_repo.py "$env:GITHUB_REPOSITORY"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build traPYze-Setup.exe
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows\trapyze.iss
      - uses: actions/upload-artifact@v4
        with: { name: setup, path: dist/traPYze-Setup.exe }

  publish:
    needs: [build, windows-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/dist/* out/setup/traPYze-Setup.exe \
            --repo "$GITHUB_REPOSITORY" --title "traPYze ${GITHUB_REF_NAME#v}" --notes-file out/notes/notes.md
